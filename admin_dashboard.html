<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IICMR ERP Portal - Admin Dashboard</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body class="dashboard-body">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon-sm">
                <!-- Using a different icon for Admin to distinguish -->
                <i class="ph-bold ph-chart-polar"></i>
            </div>
            <div class="logo-text-group">
                <span class="logo-text">ERP System</span>
                <span class="logo-subtext">Student Management</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="admin_dashboard.html" class="nav-item active">
                <i class="ph-fill ph-house"></i>
                Home
            </a>
            <a href="admin_student_data.html" class="nav-item">
                <i class="ph-fill ph-users"></i>
                Students data
            </a>
            <a href="admin_staff_data.html" class="nav-item">
                <i class="ph-fill ph-identification-card"></i>
                Staff data
            </a>
            <a href="#" class="nav-item">
                <i class="ph-fill ph-books"></i>
                Academic data
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="index.html" class="nav-item logout">
                <i class="ph-bold ph-sign-out"></i>
                Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <div class="header-actions">
                <button class="btn-icon">
                    <i class="ph-fill ph-bell"></i>
                </button>
                <img src="https://ui-avatars.com/api/?name=Admin&background=random" alt="Profile" class="user-avatar">
                <div class="user-info">
                    <span class="user-name"></span>
                    <span class="user-email"></span>
                </div>
            </div>
        </header>

        <div class="content-wrapper">
            <!-- Welcome Section with Action -->
            <div class="welcome-header-flex">
                <div class="welcome-section no-margin">
                    <h1>Welcome back, Admin!</h1>
                    <p>Here’s a summary of the system’s current status.</p>
                </div>
                <button class="btn-primary">Generate Report</button>
            </div>

            <!-- Stats Grid -->
            <div class="stats-grid three-col">
                <div class="stat-card">
                    <h3>Total Students</h3>
                    <div class="stat-main">
                        <div class="stat-value" id="total-students-val">...</div>
                        <div class="stat-change positive">
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <h3>Total Staff</h3>
                    <div class="stat-main">
                        <div class="stat-value" id="total-staff-val">...</div>
                        <div class="stat-change positive">
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <h3>Active Courses</h3>
                    <div class="stat-main">
                        <div class="stat-value">12</div>
                        <div class="stat-change negative">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts Grid -->
            <div class="charts-grid-2">
                <!-- Bar Chart -->
                <div class="chart-card">
                    <h2>Student Distribution by Course</h2>
                    <div class="chart-container">
                        <canvas id="deptChart"></canvas>
                    </div>
                </div>

                <!-- Line Chart -->
                <div class="chart-card">
                    <div class="chart-header">
                        <h2>Enrollment Trends</h2>
                        <span class="chart-subtitle">Last 6 Months <span class="green-text">+5.8%</span></span>
                    </div>
                    <div class="chart-container">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Supabase JS Client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="dashboard.js"></script>
    <script>
        // Fetch Real Stats from Supabase
        document.addEventListener('DOMContentLoaded', async () => {
            const studentVal = document.getElementById('total-students-val');
            const staffVal = document.getElementById('total-staff-val');

            const deptCtx = document.getElementById('deptChart').getContext('2d');
            const trendCtx = document.getElementById('trendChart').getContext('2d');

            try {
                // Get Total Students and their profiles (to count courses)
                const { count: studentCount, data: studentProfiles, error: studentError } = await supabaseClient
                    .from('profiles')
                    .select('course', { count: 'exact' })
                    .eq('role', 'student');

                if (studentError) throw studentError;
                studentVal.textContent = (studentCount || 0).toLocaleString();

                // Get Total Staff
                const { count: staffCount, error: staffError } = await supabaseClient
                    .from('profiles')
                    .select('*', { count: 'exact', head: true })
                    .eq('role', 'faculty');

                if (staffError) throw staffError;
                staffVal.textContent = (staffCount || 0).toLocaleString();

                // Process Course counts for the bar chart
                const courseCounts = {};
                studentProfiles.forEach(profile => {
                    const courseName = profile.course || 'Unknown';
                    courseCounts[courseName] = (courseCounts[courseName] || 0) + 1;
                });

                const labels = Object.keys(courseCounts);
                const chartData = Object.values(courseCounts);

                // Department Bar Chart
                new Chart(deptCtx, {
                    type: 'bar',
                    data: {
                        labels: labels.length > 0 ? labels : ['No Data'],
                        datasets: [{
                            label: 'Students',
                            data: chartData.length > 0 ? chartData : [0],
                            backgroundColor: '#DBEAFE',
                            borderRadius: 4,
                            hoverBackgroundColor: '#2563EB'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                display: false
                            },
                            x: {
                                grid: { display: false },
                                border: { display: false }
                            }
                        }
                    }
                });

                // Enrollment Line Chart (Keeping static for now)
                new Chart(trendCtx, {
                    type: 'line',
                    data: {
                        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                        datasets: [{
                            label: 'Enrollments',
                            data: [120, 150, 130, 160, 110, 180],
                            borderColor: '#2563EB',
                            backgroundColor: 'transparent',
                            borderWidth: 3,
                            tension: 0.4,
                            pointRadius: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: { display: false },
                            x: {
                                grid: { display: false },
                                border: { display: false }
                            }
                        }
                    }
                });

            } catch (error) {
                console.error('Error fetching dashboard stats:', error);
                if (studentVal.textContent === '...') studentVal.textContent = '0';
                if (staffVal.textContent === '...') staffVal.textContent = '0';
            }
        });
    </script>
</body>

</html>

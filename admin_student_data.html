<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IICMR ERP Portal - Admin Student Data</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        /* Specific page override for wide table */
        .content-wrapper {
            max-width: 1400px;
        }
    </style>
</head>

<body class="dashboard-body">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon-sm">
                <i class="ph-bold ph-chart-polar"></i>
            </div>
            <div class="logo-text-group">
                <span class="logo-text">ERP System</span>
                <span class="logo-subtext">Student Management</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="admin_dashboard.html" class="nav-item">
                <i class="ph-fill ph-house"></i>
                Home
            </a>
            <a href="admin_student_data.html" class="nav-item active">
                <i class="ph-fill ph-users"></i>
                Students data
            </a>
            <a href="admin_staff_data.html" class="nav-item">
                <i class="ph-fill ph-identification-card"></i>
                Staff data
            </a>
            <a href="#" class="nav-item">
                <i class="ph-fill ph-books"></i>
                Academic data
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="index.html" class="nav-item logout">
                <i class="ph-bold ph-sign-out"></i>
                Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <div class="header-actions">
                <button class="btn-icon">
                    <i class="ph-fill ph-bell"></i>
                </button>
                <img src="https://ui-avatars.com/api/?name=Admin&background=random" alt="Profile" class="user-avatar">
            </div>
        </header>

        <div class="content-wrapper">
            <!-- Breadcrumb -->
            <div class="breadcrumb-area" style="margin-bottom: 1.5rem;">
                <span>Dashboard</span> / <span>Students</span> / <span class="active">Student Data</span>
            </div>

            <div class="page-header">
                <h1>Student Data Display</h1>
            </div>

            <!-- Student Data Table Card -->
            <div class="table-card">
                <div class="table-responsive">
                    <table class="student-table">
                        <thead>
                            <tr>
                                <th style="width: 60px;">Sr. No.</th>
                                <th>Student Name</th>
                                <th>Student ID</th>
                                <th>Email</th>
                                <th>Course</th>
                                <th>Phone Number</th>
                                <th>Academic Year</th>
                            </tr>
                        </thead>
                        <tbody id="student-table-body">
                            <!-- Data will be loaded here dynamically -->
                            <tr>
                                <td colspan="7" style="text-align: center; padding: 2rem;">Loading student data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination-footer">
                    <div class="pagination" id="pagination-controls">
                        <!-- Pagination buttons will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Back Button -->
            <div class="action-footer" style="margin-top: 2rem;">
                <a href="admin_dashboard.html" class="btn-back">
                    <i class="ph-bold ph-arrow-left"></i>
                    Back
                </a>
            </div>
        </div>
    </main>

    <!-- Supabase JS Client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tableBody = document.getElementById('student-table-body');
            const paginationControls = document.getElementById('pagination-controls');

            let allStudents = [];
            let currentPage = 1;
            const itemsPerPage = 10;

            const renderTable = (page) => {
                tableBody.innerHTML = '';
                const start = (page - 1) * itemsPerPage;
                const end = start + itemsPerPage;
                const pageStudents = allStudents.slice(start, end);

                if (pageStudents.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem;">No students found.</td></tr>';
                    return;
                }

                pageStudents.forEach((student, index) => {
                    const tr = document.createElement('tr');
                    const srNo = start + index + 1;

                    tr.innerHTML = `
                        <td>${srNo}</td>
                        <td class="fw-bold">${student.full_name || 'N/A'}</td>
                        <td>${student.username || 'N/A'}</td>
                        <td>${student.email || 'N/A'}</td>
                        <td>${student.course || 'N/A'}</td>
                        <td>${student.phone || '<span style="color: #999;">Missing in DB</span>'}</td>
                        <td>${student.academic_year || '<span style="color: #999;">Missing in DB</span>'}</td>
                    `;
                    tableBody.appendChild(tr);
                });
            };

            const renderPagination = () => {
                const totalPages = Math.ceil(allStudents.length / itemsPerPage);
                paginationControls.innerHTML = '';

                if (totalPages <= 1) return;

                // Previous button
                const prevBtn = document.createElement('a');
                prevBtn.href = '#';
                prevBtn.className = `page-nav ${currentPage === 1 ? 'disabled' : ''}`;
                prevBtn.innerHTML = '<i class="ph-bold ph-caret-left"></i>';
                prevBtn.onclick = (e) => {
                    e.preventDefault();
                    if (currentPage > 1) {
                        currentPage--;
                        updateView();
                    }
                };
                paginationControls.appendChild(prevBtn);

                // Page numbers
                for (let i = 1; i <= totalPages; i++) {
                    const pageLink = document.createElement('a');
                    pageLink.href = '#';
                    pageLink.className = `page-link ${currentPage === i ? 'active' : ''}`;
                    pageLink.textContent = i;
                    pageLink.onclick = (e) => {
                        e.preventDefault();
                        currentPage = i;
                        updateView();
                    };
                    paginationControls.appendChild(pageLink);
                }

                // Next button
                const nextBtn = document.createElement('a');
                nextBtn.href = '#';
                nextBtn.className = `page-nav ${currentPage === totalPages ? 'disabled' : ''}`;
                nextBtn.innerHTML = '<i class="ph-bold ph-caret-right"></i>';
                nextBtn.onclick = (e) => {
                    e.preventDefault();
                    if (currentPage < totalPages) {
                        currentPage++;
                        updateView();
                    }
                };
                paginationControls.appendChild(nextBtn);
            };

            const updateView = () => {
                renderTable(currentPage);
                renderPagination();
            };

            try {
                const { data: students, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('role', 'student');

                if (error) throw error;

                allStudents = students || [];
                updateView();

            } catch (error) {
                console.error('Error fetching students:', error);
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 2rem; color: var(--danger-color);">Error loading data: ${error.message}</td></tr>`;
            }
        });
    </script>
</body>

</html>

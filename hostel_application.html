<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IICMR ERP Portal - Hostel Application</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body class="dashboard-body">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon-sm">
                <i class="ph-bold ph-graduation-cap"></i>
            </div>
            <span class="logo-text">IICMR ERP Portal</span>
        </div>

        <nav class="sidebar-nav">
            <a href="student_dashboard.html" class="nav-item">
                <i class="ph-fill ph-house"></i>
                Home
            </a>
            <a href="student_profile.html" class="nav-item">
                <i class="ph-fill ph-user"></i>
                Profile
            </a>
            <a href="exam_timetable.html" class="nav-item">
                <i class="ph-fill ph-file-text"></i>
                Exam
            </a>
            <a href="hostel_application.html" class="nav-item active">
                <i class="ph-fill ph-house-line"></i>
                Hostel
            </a>
            <a href="fee_overview.html" class="nav-item">
                <i class="ph-fill ph-receipt"></i>
                Fee
            </a>
            <a href="student_assignments.html" class="nav-item">
                <i class="ph-fill ph-clipboard-text"></i>
                Assignment
            </a>
            <a href="student_notices.html" class="nav-item">
                <i class="ph-fill ph-megaphone"></i>
                Notice
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="index.html" class="nav-item logout">
                <i class="ph-bold ph-sign-out"></i>
                Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <div class="user-profile">
                <div class="user-info">
                    <span class="user-name">Student Name</span>
                    <span class="user-email">student@university.iimcr</span>
                </div>
                <img src="https://ui-avatars.com/api/?name=Student+Name&background=0D8ABC&color=fff" alt="Profile"
                    class="user-avatar">
            </div>
        </header>

        <div class="content-wrapper">
            <!-- Breadcrumb / Header -->
            <div class="breadcrumb-area">
                <span>Dashboard</span> / <span>Hostels</span> / <span class="active">New Application</span>
            </div>

            <div class="page-header">
                <h1>Hostel Application Form</h1>
                <p>Please fill in the student's details for hostel allocation.</p>
            </div>

            <!-- Application Form Card -->
            <div class="form-card">
                <form id="hostelForm">
                    <!-- Student's Full Name -->
                    <div class="form-row full-width">
                        <div class="form-group-dash">
                            <label for="fullName">Student's Full Name *</label>
                            <input type="text" id="fullName" name="fullName" placeholder="Enter student's full name"
                                required>
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <!-- Academic Year -->
                        <div class="form-group-dash">
                            <label for="academicYear">Academic Year</label>
                            <div class="select-wrapper">
                                <select id="academicYear" name="academicYear">
                                    <option value="2024-2025">2024-2025</option>
                                    <option value="2025-2026">2025-2026</option>
                                </select>
                                <i class="ph ph-caret-down select-icon"></i>
                            </div>
                        </div>

                        <!-- Duration of Stay -->
                        <div class="form-group-dash">
                            <label for="duration">Duration of Stay</label>
                            <div class="select-wrapper">
                                <select id="duration" name="duration">
                                    <option value="Full Academic Year">Full Academic Year</option>
                                    <option value="One Semester">One Semester</option>
                                </select>
                                <i class="ph ph-caret-down select-icon"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Course Name -->
                    <div class="form-row full-width">
                        <div class="form-group-dash">
                            <label for="courseName">Course Name *</label>
                            <input type="text" id="courseName" name="courseName"
                                placeholder="e.g. Computer Science and Engineering" required>
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <!-- Contact Email -->
                        <div class="form-group-dash">
                            <label for="email">Contact Email *</label>
                            <input type="email" id="email" name="email" placeholder="student.email@example.com"
                                required>
                        </div>

                        <!-- Phone Number -->
                        <div class="form-group-dash">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" name="phone" placeholder="+91 0000000000" pattern="[0-9]{10,}"
                                title="Please enter at least 10 digits" required>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="form-actions">
                        <button type="button" class="btn-cancel">Cancel</button>
                        <button type="submit" class="btn-submit">Submit Application</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="dashboard.js"></script>
    <script>
        document.getElementById('hostelForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const courseName = document.getElementById('courseName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (!fullName || !courseName || !email || !phone) {
                alert('Please fill in all required fields.');
                return;
            }

            // Basic Email Validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                alert('Please enter a valid email address.');
                return;
            }

            // Phone Validation (Simple check for numeric and length)
            const phonePattern = /^\d{10,}$/;
            // Remove non-digit chars for check
            const cleanPhone = phone.replace(/\D/g, '');
            if (cleanPhone.length < 10) {
                alert('Please enter a valid phone number (at least 10 digits).');
                return;
            }

            alert('Hostel Application Submitted Successfully!');
            // Optional: e.target.reset();
        });

        document.querySelector('.btn-cancel').addEventListener('click', () => {
            if (confirm("Discard application?")) {
                window.location.href = 'student_dashboard.html';
            }
        });
    </script>
</body>

</html>

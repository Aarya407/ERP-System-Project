<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IICMR ERP Poratl - Fee Overview</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body class="dashboard-body">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon-sm">
                <i class="ph-bold ph-graduation-cap"></i>
            </div>
            <span class="logo-text">IICMR ERP Portal</span>
        </div>

        <nav class="sidebar-nav">
            <a href="student_dashboard.html" class="nav-item">
                <i class="ph-fill ph-house"></i>
                Home
            </a>
            <a href="#" class="nav-item">
                <i class="ph-fill ph-user"></i>
                Profile
            </a>
            <a href="exam_timetable.html" class="nav-item">
                <i class="ph-fill ph-file-text"></i>
                Exam
            </a>
            <a href="hostel_application.html" class="nav-item">
                <i class="ph-fill ph-house-line"></i>
                Hostel
            </a>
            <a href="fee_overview.html" class="nav-item active">
                <i class="ph-fill ph-receipt"></i>
                Fee
            </a>
            <a href="student_assignments.html" class="nav-item">
                <i class="ph-fill ph-clipboard-text"></i>
                Assignment
            </a>
            <a href="student_notices.html" class="nav-item">
                <i class="ph-fill ph-megaphone"></i>
                Notice
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="index.html" class="nav-item logout">
                <i class="ph-bold ph-sign-out"></i>
                Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <div class="user-profile">
                <div class="user-info">
                    <span class="user-name">Student Name</span>
                    <span class="user-email">student@university.iicmr</span>
                </div>
                <img src="https://ui-avatars.com/api/?name=Student+Name&background=0D8ABC&color=fff" alt="Profile"
                    class="user-avatar">
            </div>
        </header>

        <div class="content-wrapper">
            <!-- Page Header -->
            <div class="page-header">
                <h1>Fee Overview</h1>
            </div>

            <!-- Fee Cards Grid -->
            <div class="fee-grid">
                <!-- Total Fee -->
                <div class="fee-card">
                    <h3>Total Fee</h3>
                    <div class="fee-value">10,000.00</div>
                </div>
                <!-- Paid Fee -->
                <div class="fee-card">
                    <h3>Paid Fee</h3>
                    <div class="fee-value">8,500.00</div>
                </div>
                <!-- Due Fee -->
                <div class="fee-card">
                    <h3>Due Fee</h3>
                    <div class="fee-value">1,500.00</div>
                </div>
            </div>
            <br>
            <br>

            <!-- Back Button Area -->
            <div class="back-action-container">
                <a href="student_dashboard.html" class="btn-primary-lg">
                    Back to Dashboard
                </a>
            </div>
        </div>
    </main>

    <script src="dashboard.js"></script>
</body>

</html>
